[project]
name = "octo-py"
version = "0.1.0"
description = ""
authors = [
    { name = "Sean Johnson", email = "seanson@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.4,<3.0.0",
    "click>=8.2.1,<9.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "tabulate>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.2,<0.13.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
    "mypy>=1.11,<2.0",
    "types-requests",
    "types-tabulate",
    "types-tqdm",
]

[tool.uv]
# Application, not a distributable package: manage the environment only,
# don't build/install the project root (equivalent to Poetry's package-mode = false).
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
# The code passes mypy's default checks today. To ratchet toward strict,
# enable disallow_untyped_defs / disallow_any_generics and resolve the
# resulting type-arg (bare `dict`) and no-untyped-def findings (mostly main.py).

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    'if __name__ == .__main__.:',
]
# Regression floor, not a target. Ratchet upward as coverage improves.
# Both modules are at 100%; this floor leaves slack for the odd new line.
fail_under = 95
