[project]
name = "octo-py"
version = "0.1.0"
description = ""
authors = [
    { name = "Sean Johnson", email = "seanson@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.4,<3.0.0",
    "click>=8.2.1,<9.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "tabulate>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.2,<0.13.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
]

[tool.uv]
# Application, not a distributable package: manage the environment only,
# don't build/install the project root (equivalent to Poetry's package-mode = false).
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # Allow assert in tests
